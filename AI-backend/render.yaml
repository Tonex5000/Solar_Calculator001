services:
  - type: web
    name: ai-solar-backend
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install fastapi "uvicorn[standard]" openai python-dotenv
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
